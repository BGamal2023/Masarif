<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<title>مصاريف الشهر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
html{color-scheme:light dark}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: one narrow phone column; summary card on top, breakdown, then the day's log. Add bar fixed at the bottom like a till. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#14201e; --muted:#5d6b68; --line:#d6dfdd;
  --accent:#0d6b5e; --accent-ink:#ffffff; --accent-soft:#d5ebe6; --danger:#b42318;
  --font-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-display:"Readex Pro", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#18211f; --ink:#e7eeec; --muted:#9aaaa6; --line:#2a3633;
  --accent:#3fbfa8; --accent-ink:#06201b; --accent-soft:#1d3a34; --danger:#f97066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#18211f; --ink:#e7eeec; --muted:#9aaaa6; --line:#2a3633;
  --accent:#3fbfa8; --accent-ink:#06201b; --accent-soft:#1d3a34; --danger:#f97066; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 150px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-family:var(--font-display);font-size:20px;margin:0;font-weight:600}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}

.summary{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month-nav button{background:transparent;border:1px solid color-mix(in srgb,var(--accent-ink) 35%,transparent);color:var(--accent-ink);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
.month-nav button:disabled{opacity:.35;cursor:default}
.month-label{font-weight:600;font-size:15px}
.curswitch{display:flex;gap:4px;background:color-mix(in srgb,var(--accent-ink) 14%,transparent);border-radius:999px;padding:4px;align-self:flex-start;margin-top:8px;flex-wrap:wrap}
.curswitch button{background:transparent;border:0;color:var(--accent-ink);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.curswitch button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent);font-weight:600}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.total-label{font-size:13px;opacity:.85;margin-top:6px}
.total{font-size:40px;font-weight:700;line-height:1.1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.total small{font-size:16px;font-weight:500;opacity:.85}
.sub{font-size:13px;opacity:.85}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
section.card h2{font-size:15px;margin:0;font-weight:600;font-family:var(--font-display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section.card h2 span{font-family:var(--font-body);font-weight:400;font-size:13px;color:var(--muted)}

.cats{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%}
.cat-name{font-weight:500;min-width:0}
.cat-amt{text-align:left;font-weight:600;white-space:nowrap}
.bar{grid-column:1 / -1;height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.cat-meta{grid-column:2 / -1;font-size:12px;color:var(--muted);margin-top:-2px}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.day{font-size:12px;color:var(--muted);padding:10px 0 4px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item-name{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item-price{font-weight:600;white-space:nowrap}
.item-tools{grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px}
.link{background:none;border:0;color:var(--muted);font-size:12px;padding:2px 4px;text-decoration:underline}
.link.danger{color:var(--danger)}

.year-total{font-size:28px;font-weight:700;line-height:1.1;display:flex;align-items:baseline;gap:8px}
.year-total small{font-size:14px;font-weight:500;color:var(--muted)}
.months{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.months button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:transparent;border:0;border-radius:10px;padding:8px;text-align:start}
.months button.on{background:var(--accent-soft)}
.months .m-name{font-weight:500}
.months .m-amt{font-weight:600;white-space:nowrap}
.months .m-amt.zero{color:var(--muted);font-weight:400}
.months .bar i{background:var(--accent)}
button.cat-row{width:100%;background:transparent;border:0;border-radius:10px;padding:6px;margin:-6px;width:calc(100% + 12px);text-align:start}
button.cat-row:hover{background:var(--bg)}
.cat-go{color:var(--muted);font-size:12px}
.finder{display:flex;gap:8px}
.suggest{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:340px;overflow:auto}
.suggest .sg-h{font-size:12px;color:var(--muted);padding:8px 12px 4px}
.suggest button{display:flex;align-items:center;gap:8px;width:100%;text-align:start;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 12px;font-size:15px;color:inherit}
.suggest .sg-h+button{border-top:0}
.suggest button .sg-n{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.suggest .sg-empty{padding:10px 12px;font-size:14px;color:var(--muted)}
.finder input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.tiphint{font-size:12px;color:var(--muted);margin:-4px 0 0}
button.item-name{background:none;border:0;padding:0;text-align:start;text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.rep-head{display:flex;align-items:center;gap:8px}
.rep-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);border-radius:12px;padding:6px}
.rep-nav button{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
.rep-nav button:disabled{opacity:.35;cursor:default}
.rep-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rep-stats div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rep-stats span{font-size:12px;color:var(--muted)}
.rep-stats b{font-family:var(--font-display);font-size:18px}
.rep-sec{font-weight:600;font-size:14px;margin-top:4px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 4px;display:flex;flex-direction:column;gap:8px}
.empty b{color:var(--ink)}

/* Add bar */
.addbar{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.addbar form{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 110px auto;gap:8px}
.addbar input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.addbar .price{text-align:center}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;font-weight:600;font-size:16px}
.hint{max-width:520px;margin:6px auto 0;font-size:12px;color:var(--muted);min-height:1.2em}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.sheet h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick button{display:flex;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px}
.pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.newcat{display:flex;gap:8px}
.newcat input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:14px}
label.fld select,label.fld input{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.learned{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.learned li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
/* Budgets & groups */
:root{--warn:#b35c00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#f5a524}}
:root[data-theme="dark"]{--warn:#f5a524}
.sum-budget{margin-top:8px;background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border:0;border-radius:12px;padding:10px 12px;color:var(--accent-ink);text-align:start;display:flex;flex-direction:column;gap:6px;font-size:13px}
.sum-budget .sb-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sum-budget .sb-bar{height:8px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);border-radius:99px;overflow:hidden}
.sum-budget .sb-bar i{display:block;height:100%;border-radius:99px;background:var(--accent-ink)}
.sum-budget.over{background:color-mix(in srgb,#e03131 35%,transparent)}
.bud-ok{color:var(--muted)} .bud-warn{color:var(--warn);font-weight:600} .bud-over{color:var(--danger);font-weight:600}
.bar.limit{height:10px;position:relative}
.cards-tools{display:flex;gap:8px;flex-wrap:wrap}
.grp-li{display:flex;flex-direction:column;gap:2px}
.grp-li .grp-tools{display:flex;justify-content:flex-end}
.bud-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bud-list li{display:grid;grid-template-columns:auto 1fr 110px;gap:4px 10px;align-items:center}
.bud-list li .note{grid-column:2 / -1;margin-top:-4px}
.bud-list input,.money-in{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px;text-align:center}
@media (max-width:380px){.addbar form{grid-template-columns:1fr 90px}.addbar .primary{grid-column:1 / -1;padding:10px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <h1>مصاريف الشهر</h1>
    <button class="iconbtn" id="openSettings" type="button">الإعدادات</button>
  </header>

  <div class="summary">
    <div class="month-nav">
      <button type="button" id="prevM" aria-label="الشهر اللي فات">›</button>
      <div class="month-label" id="monthLabel"></div>
      <button type="button" id="nextM" aria-label="الشهر اللي بعده">‹</button>
    </div>
    <div class="curswitch" id="curSwitch" role="group" aria-label="العملة"></div>
    <div class="total-label">صرفت الشهر ده</div>
    <div class="total num"><span id="total">٠</span><small id="cur"></small></div>
    <div class="sub" id="subline"></div>
    <button type="button" class="sum-budget" id="sumBudget"></button>
  </div>

  <section class="card" aria-labelledby="catsH">
    <h2 id="catsH">الصرف حسب الصنف <span id="catsCount"></span></h2>
    <p class="tiphint" id="catsTip">دوس على أي صنف تشوف صرفه شهر بشهر وفي السنة كلها.</p>
    <ul class="cats" id="cats"></ul>
    <form class="finder" id="finder" autocomplete="off">
      <input id="findQ" type="text" placeholder="دوس تشوف الأصناف، أو اكتب حاجة" aria-label="اسم الحاجة اللي عايز تشوف صرفها">
      <button class="secondary" type="submit">اعرض</button>
    </form>
    <div class="suggest" id="findList" hidden></div>
    <div class="cards-tools"><button class="secondary" type="button" id="openBudget">ميزانية الشهر</button></div>
  </section>

  <section class="card" aria-labelledby="grpH">
    <h2 id="grpH">المجموعات <span id="grpCount"></span></h2>
    <ul class="cats" id="groups"></ul>
    <div class="cards-tools"><button class="secondary" type="button" id="addGroup">أضف مجموعة</button></div>
  </section>

  <section class="card" aria-labelledby="yearH">
    <h2 id="yearH"><span id="yearTitle" style="font:inherit;color:inherit"></span> <span id="yearCount"></span></h2>
    <div class="year-total num"><span id="yearTotal"></span><small id="yearCur"></small></div>
    <ul class="months" id="months"></ul>
  </section>

  <section class="card" aria-labelledby="logH">
    <h2 id="logH">المشتريات <span id="logCount"></span></h2>
    <ul class="log" id="log"></ul>
  </section>

  <p class="note" id="storageNote"></p>
</div>

<div class="addbar" dir="rtl" lang="ar">
  <form id="addForm" autocomplete="off" novalidate>
    <input id="itemName" type="text" placeholder="اشتريت إيه؟ (مثلاً: عيش)" aria-label="اسم الحاجة" required>
    <input id="itemPrice" class="price num" type="text" inputmode="decimal" placeholder="السعر" aria-label="السعر">
    <button class="primary" type="submit">أضف</button>
  </form>
  <div class="hint" id="hint"></div>
</div>

<div id="sheetHost" dir="rtl" lang="ar"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";

/* ---------- Categories & keywords ---------- */
const DEFAULT_CATS = [
  {id:"food",   name:"أكل وبقالة",        color:"#2f9e44"},
  {id:"out",    name:"مطاعم وكافيهات",     color:"#e8590c"},
  {id:"trans",  name:"مواصلات وعربية",     color:"#1c7ed6"},

const EXTRA_COLORS = ["#495057","#087f5b","#364fc7","#d9480f","#862e9c","#5f3dc4","#2b8a3e","#a61e4d"];

const KEYWORDS = {
  food:"عيش خبز فينو رغيف لبن حليب زبادي جبنه جبن بيض فول طعميه رز ارز مكرونه سكر شاي قهوه بن زيت سمن زبده لحمه لحم فراخ دجاج فرخه سمك جمبري تونه خضار خضروات خضره طماطم بطاطس بصل ثوم خيار فلفل جزر كوسه باذنجان ملوخيه فاكهه فاكهة موز تفاح برتقال عنب مانجو بطيخ فراوله عسل مربي حلاوه طحينه عدس فاصوليا بسله دقيق مياه ميه معدنيه بقاله سوبرماركت ماركت هايبر كارفور خبيزه بسكويت شيبسي شيبسى عصير نسكافيه كاكاو توابل ملح كاتشب مايونيز لانشون بسطرمه سجق كبده جبنه رومي بلدي مخلل زيتون ياميش تمر بلح كرنب قرنبيط سبانخ بقدونس كزبره نعناع جوافه رمان خوخ مشمش ليمون اكل",
  out:"مطعم كافيه قهوه_بره بيتزا برجر برجرز شاورما كشري كباب كفته حواوشي سندوتش سندويتش ساندوتش وجبه وجبات دليفري ديليفري طلبات توصيل ماكدونالدز كنتاكي ستاربكس هرفي كوكي ايس_كريم ايسكريم جيلاتي حلواني بسبوسه كنافه جاتوه تورته فطير فطاطري كريب مندي حاتي",
  trans:"بنزين سولار جاز اوبر كريم ديدي اندرايفر سويفل تاكسي ميكروباص مكروباص توكتوك تكتك اتوبيس مترو قطر قطار تذكره تذاكر موقف جراج ركنه غسيل_عربيه عربيه زيت_موتور كاوتش فرامل ميكانيكي صيانه_عربيه مخالفه رخصه كارته مواصلات",
  bills:"كهربا كهرباء نور مياه_البيت فاتوره فواتير غاز عداد ايجار اجار صيانه_العماره زباله بواب اشتراك_نادي قسط اقساط تقسيط جمعيه",

/* ---------- Text helpers ---------- */
const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩", FA_DIGITS="۰۱۲۳۴۵۶۷۸۹";
function toLatinDigits(s){
  return String(s).replace(/[٠-٩]/g,d=>AR_DIGITS.indexOf(d)).replace(/[۰-۹]/g,d=>FA_DIGITS.indexOf(d)).replace(/[٫,]/g,".");
}
function norm(s){
  return toLatinDigits(String(s||"")).toLowerCase()
    .replace(/[ً-ْـ]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
}
function stripAl(w){ return w.length>4 && w.startsWith("ال") ? w.slice(2) : w; }
function itemKey(name){ return norm(name).split(" ").map(stripAl).join(" "); }

const KW = []; // {phrase:[words], cat}
for (const [cat,str] of Object.entries(KEYWORDS)){
  for (const k of str.split(/\s+/)) if (k) KW.push({words:norm(k.replace(/_/g," ")).split(" ").map(stripAl), cat});
}
KW.sort((a,b)=>b.words.length-a.words.length);

function guessCategory(name){
  const key = itemKey(name);
  if (!key) return null;
  if (state.learned[key]) return {cat:state.learned[key], how:"learned"};
  const words = key.split(" ");
  // a learned item that appears inside the new text (e.g. learned "جبنه رومي" and typed "جبنه رومي نص كيلو")
  let best=null;
  for (const [lk,cat] of Object.entries(state.learned)){
    const lw=lk.split(" ");
    if (containsSeq(words,lw) && (!best || lw.length>best.len)) best={cat,len:lw.length};
  }
  if (best && catById(best.cat)) return {cat:best.cat, how:"learned"};
  for (const k of KW){
    if (containsSeq(words,k.words)) return {cat:k.cat, how:"auto"};
  }
  // prefix match on single words (e.g. "فراخات", "بنزينه")
  for (const k of KW){
    if (k.words.length===1 && k.words[0].length>=3 && words.some(w=>w.startsWith(k.words[0]))) return {cat:k.cat, how:"auto"};
  }
  return null;
}
function containsSeq(words,seq){
  outer: for (let i=0;i+seq.length<=words.length;i++){
    for (let j=0;j<seq.length;j++) if (words[i+j]!==seq[j]) continue outer;
    return true;
  }
  return false;
}

/* ---------- State ---------- */
const CURRENCIES = [
  {code:"EGP", label:"ج.م", name:"جنيه مصري"},
  {code:"SAR", label:"ر.س", name:"ريال سعودي"},
  {code:"AED", label:"د.إ", name:"درهم إماراتي"},
  {code:"KWD", label:"د.ك", name:"دينار كويتي"},
  {code:"USD", label:"$",   name:"دولار أمريكي"},
  {code:"EUR", label:"€",   name:"يورو"}
];
const state = {
  settings:{currency:"EGP", currencies:["EGP","SAR"], customCats:[], digits:"ar"},
  learned:{},          // itemKey -> catId
  months:{},           // "2026-11" -> [expenses]
  viewMonth: monthKey(new Date())
};
function monthKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function allCats(){ const nm=state.settings.catNames||{}; return DEFAULT_CATS.map(c=>nm[c.id]?Object.assign({},c,{name:nm[c.id]}):c).concat(state.settings.customCats||[]); }
function catById(id){ return allCats().find(c=>c.id===id) || (id==="other"?{id:"other",name:"حاجات تانية",color:"#868e96"}:null); }
function cur(){ return curInfo(state.settings.currency); }
function curInfo(code){ return CURRENCIES.find(c=>c.code===code) || {code, label:code, name:code}; }
function itemCur(x){ return x.cur || "EGP"; } // items saved before currencies existed were in EGP
function enabledCurs(){
  let list=(state.settings.currencies||["EGP","SAR"]).filter(c=>CURRENCIES.some(k=>k.code===c));
  if(!list.length) list=["EGP"];
  if(!list.includes(state.settings.currency)) list=[state.settings.currency].concat(list);
  return list;
}

/* ---------- Budgets (monthly limits, per currency) and category groups ---------- */
// settings.budgets = {total:{EGP:5000}, cats:{food:{EGP:2000}}}; settings.groups = [{id,name,color,cats:[ids],limits:{EGP:3000}}]
function budgets(){ const b=state.settings.budgets||{}; return {total:b.total||{}, cats:b.cats||{}}; }
function totalLimit(){ const v=+budgets().total[state.settings.currency]; return v>0?v:null; }
function catLimit(id){ const c=budgets().cats[id]; const v=c?+c[state.settings.currency]:0; return v>0?v:null; }
function setLimit(obj,v){ const c=state.settings.currency; if(v>0) obj[c]=v; else delete obj[c]; return obj; }
function groups(){ return Array.isArray(state.settings.groups)?state.settings.groups:[]; }
function grpLimit(g){ const v=g&&g.limits?+g.limits[state.settings.currency]:0; return v>0?v:null; }
function budLevel(spent,limit){ const p=spent/limit; return p>1?"over":p>=0.8?"warn":"ok"; }
function budColor(lv,base){ return lv==="over"?"var(--danger)":lv==="warn"?"var(--warn)":base; }
function budText(spent,limit){
  const L=cur().label, pct=Math.round(spent/limit*100), lv=budLevel(spent,limit);
  if(lv==="over") return `<span class="bud-over">عديت الحد بـ ${fmt(Math.round((spent-limit)*100)/100)} ${esc(L)} (${fmtInt(pct)}٪)</span>`;
  return `<span class="bud-${lv}">باقي ${fmt(Math.round((limit-spent)*100)/100)} من ${fmt(limit)} ${esc(L)} · استهلكت ${fmtInt(pct)}٪</span>`;
}

/* ---------- Storage: db when available, browser storage as fallback ---------- */
let db=null, uid=null, ready=false;
const LS="expenses-trial-v1";
function lsLoad(){ try{ const j=JSON.parse(localStorage.getItem(LS)||"null"); if(j){ Object.assign(state.settings,j.settings||{}); state.learned=j.learned||{}; state.months=j.months||{}; } }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS,JSON.stringify({settings:state.settings,learned:state.learned,months:state.months})); }catch(e){} }

const queues={};
function writeDoc(name,body){
  lsSave();
  if(!db||!uid) return;
  const ref=db.collection("data/users/"+uid).doc(name);
  queues[name]=(queues[name]||Promise.resolve()).then(()=>ref.set(body)).catch(e=>{
    if(e&&e.code==="quota_exceeded") toast("المساحة اتملت، امسح شهور قديمة");
  });
}
function saveMonth(m){ writeDoc("m-"+m,{items:state.months[m]||[]}); }
function saveProfile(){ writeDoc("profile",{settings:state.settings,learned:state.learned}); }

async function initDb(){
  try{
    const w=window.claude; if(!w||!w.use){ setNote("local"); return; }
    const [d,u]=await Promise.all([w.use("db"),w.use("user")]);
    if(!d||!u){ setNote("local"); return; }
    const id=await u.id(); if(!id){ setNote("local"); return; }
    db=d; uid=id;
    const col=db.collection("data/users/"+uid);
    const timer=setTimeout(()=>setNote("slow"),10000);
    let first=true;
    col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){ clearTimeout(timer); setNote("cloud"); }
      const empty = snap.docs.length===0;
      if(first && empty){
        if(snap.metadata.fromCache) return; // wait for the store's real answer
        // first time on the cloud: push anything saved in this browser
        first=false;
        if(Object.keys(state.months).length||Object.keys(state.learned).length){
          saveProfile(); Object.keys(state.months).forEach(saveMonth);
        }
        return;
      }
      first=false;
      if(snap.metadata.hasPendingWrites) return;
      const months={};
      for(const doc of snap.docs){
        const data=doc.data()||{};
        if(doc.id==="profile"){ if(data.settings) state.settings=Object.assign({},state.settings,data.settings); state.learned=Object.assign({},data.learned||{}); }
        else if(doc.id.startsWith("m-")) months[doc.id.slice(2)]=(data.items||[]).slice();
      }
      state.months=months; lsSave(); render();
    },err=>{ clearTimeout(timer); setNote("local"); db=null; });
  }catch(e){ setNote("local"); }
}
function setNote(kind){
  const el=document.getElementById("storageNote");
  el.textContent = kind==="cloud" ? "بياناتك محفوظة في حسابك وتظهر لك من أي جهاز تفتح منه الصفحة."
    : kind==="slow" ? "مش قادر أوصل للحفظ في الحساب دلوقتي، البيانات محفوظة على الجهاز ده مؤقتاً."
    : "البيانات محفوظة على موبايلك ده بس، ومش بتتبعت لأي مكان.";
}

/* ---------- Formatting ---------- */
function fmt(n){
  const loc = state.settings.digits==="en" ? "en-US" : "ar-EG";
  return new Intl.NumberFormat(loc,{maximumFractionDigits:2}).format(n);
}
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function monthTitle(m){ const [y,mm]=m.split("-"); return MONTHS[+mm-1]+" "+(state.settings.digits==="en"?y:fmtInt(+y)); }
function fmtInt(n){ return new Intl.NumberFormat(state.settings.digits==="en"?"en-US":"ar-EG",{useGrouping:false}).format(n); }
const DAYS=["الأحد","الاتنين","التلات","الأربع","الخميس","الجمعة","السبت"];
function dayTitle(ts){
  const d=new Date(ts), t=new Date(); const y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "النهارده";
  if(d.toDateString()===y.toDateString()) return "امبارح";
  return DAYS[d.getDay()]+" "+fmtInt(d.getDate())+" "+MONTHS[d.getMonth()];
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- Render ---------- */
function render(){
  const m=state.viewMonth, active=state.settings.currency;
  const monthAll=state.months[m]||[];
  const items=monthAll.filter(x=>itemCur(x)===active).sort((a,b)=>b.ts-a.ts);
  document.getElementById("curSwitch").innerHTML=enabledCurs().map(c=>{ const i=curInfo(c);
    return `<button type="button" data-cur="${c}" aria-pressed="${c===active}">${esc(i.name)}</button>`; }).join("");
  const others={}; monthAll.forEach(x=>{ const c=itemCur(x); if(c!==active) others[c]=(others[c]||0)+x.price; });
  const othersText=Object.entries(others).map(([c,v])=>fmt(v)+" "+curInfo(c).label).join(" و ");
  const total=items.reduce((s,x)=>s+x.price,0);
  document.getElementById("monthLabel").textContent=monthTitle(m);
  document.getElementById("total").textContent=fmt(total);
  document.getElementById("cur").textContent=cur().label;
  document.getElementById("nextM").disabled = m>=monthKey(new Date());
  const days=new Set(items.map(x=>new Date(x.ts).toDateString())).size;
  document.getElementById("subline").textContent = items.length
    ? fmtInt(items.length)+" حاجة في "+fmtInt(days)+" يوم"+ (days? " · متوسط اليوم "+fmt(Math.round(total/days))+" "+cur().label : "")
    : "لسه مفيش مصاريف بال"+cur().name+" في الشهر ده";
  if(othersText) document.getElementById("subline").textContent += " · وكمان صرفت "+othersText;

  // month budget
  const tl=totalLimit(), sb=document.getElementById("sumBudget");
  if(tl){
    const lv=budLevel(total,tl), pct=Math.round(total/tl*100);
    sb.className="sum-budget"+(lv==="over"?" over":"");
    sb.innerHTML=`<span class="sb-top"><span>ميزانية الشهر ${fmt(tl)} ${esc(cur().label)}</span><b class="num">${fmtInt(pct)}٪</b></span>
      <span class="sb-bar"><i style="width:${Math.min(100,pct)}%"></i></span>
      <span>${lv==="over"?"⚠ عديت الميزانية بـ "+fmt(Math.round((total-tl)*100)/100):"باقي "+fmt(Math.round((tl-total)*100)/100)} ${esc(cur().label)}</span>`;
  } else { sb.className="sum-budget"; sb.innerHTML=`<span>+ حط حد (ميزانية) للشهر بال${esc(cur().name)}</span>`; }
  document.getElementById("openBudget").textContent = tl||Object.keys(budgets().cats).some(id=>catLimit(id)) ? "عدّل ميزانية الشهر" : "حط ميزانية للشهر ولكل صنف";

  // categories (with a budget they show even before any spending)
  const by={}; items.forEach(x=>{ (by[x.cat]=by[x.cat]||{sum:0,n:0}); by[x.cat].sum+=x.price; by[x.cat].n++; });
  Object.keys(budgets().cats).forEach(id=>{ if(catLimit(id)&&catById(id)&&!by[id]) by[id]={sum:0,n:0}; });
  const rows=Object.entries(by).sort((a,b)=>b[1].sum-a[1].sum);
  const max=rows.length?rows[0][1].sum||1:1;
  const catsEl=document.getElementById("cats");
  document.getElementById("catsCount").textContent = rows.length? fmtInt(rows.length)+" صنف":"";
  document.getElementById("catsTip").hidden = !rows.length;
  catsEl.innerHTML = rows.length ? rows.map(([id,v])=>{
    const c=catById(id)||{name:id,color:"#868e96"}; const pct=total?Math.round(v.sum/total*100):0, lim=catLimit(id);
    const lv=lim?budLevel(v.sum,lim):"ok", w=lim?Math.min(100,v.sum/lim*100):Math.max(3,v.sum/max*100);
    return `<li><button type="button" class="cat-row" data-rep-cat="${esc(id)}"><span class="dot" style="background:${c.color}"></span><span class="cat-name">${esc(c.name)}</span><span class="cat-amt num">${fmt(v.sum)} ${esc(cur().label)}</span>
      <span class="cat-meta">${lim?budText(v.sum,lim):`${fmtInt(pct)}٪ من الشهر · ${fmtInt(v.n)} ${v.n===1?"حاجة":"حاجات"}`} <span class="cat-go">· تقرير ‹</span></span>
      <span class="bar${lim?" limit":""}"><i style="width:${w}%;background:${budColor(lv,c.color)}"></i></span></button></li>`;
  }).join("") : `<li class="empty">الأصناف هتظهر هنا أول ما تضيف مصاريف.</li>`;

  // groups
  const gs=groups(), gEl=document.getElementById("groups");
  document.getElementById("grpCount").textContent = gs.length? fmtInt(gs.length)+" مجموعة":"";
  gEl.innerHTML = gs.length ? gs.map(g=>{
    const sum=items.filter(x=>(g.cats||[]).includes(x.cat)).reduce((a,x)=>a+x.price,0), lim=grpLimit(g);
    const lv=lim?budLevel(sum,lim):"ok", names=(g.cats||[]).map(id=>(catById(id)||{name:"؟"}).name).join("، ");
    const w=lim?Math.min(100,sum/lim*100):(total?sum/total*100:0);
    return `<li class="grp-li"><button type="button" class="cat-row" data-rep-grp="${esc(g.id)}"><span class="dot" style="background:${g.color}"></span><span class="cat-name">${esc(g.name)}</span><span class="cat-amt num">${fmt(sum)} ${esc(cur().label)}</span>
      <span class="cat-meta">${lim?budText(sum,lim):`${fmtInt(total?Math.round(sum/total*100):0)}٪ من الشهر`}<br><span class="note">${names?esc(names):"مفيش أصناف لسه"}</span></span>
      <span class="bar${lim?" limit":""}"><i style="width:${Math.max(sum?3:0,w)}%;background:${budColor(lv,g.color)}"></i></span></button>
      <span class="grp-tools"><button class="link" type="button" data-edit-grp="${esc(g.id)}">عدّل المجموعة</button></span></li>`;
  }).join("") : `<li class="empty">اجمع كذا صنف تحت اسم واحد، مثلاً «الأكل» = البقالة والمطاعم والكافيهات والتسالي، وحط لها حد للشهر لو حابب وتشوف وصلت لفين.</li>`;

  // year
  const year=m.split("-")[0], nowKey=monthKey(new Date());
  let yTotal=0, yMax=0; const mrows=[];
  for(let i=1;i<=12;i++){
    const k=year+"-"+String(i).padStart(2,"0"); if(k>nowKey) break;
    const sum=(state.months[k]||[]).filter(x=>itemCur(x)===active).reduce((a,x)=>a+x.price,0);
    yTotal+=sum; yMax=Math.max(yMax,sum); mrows.push({k,i,sum});
  }
  document.getElementById("yearTitle").textContent="مصاريف سنة "+(state.settings.digits==="en"?year:fmtInt(+year));
  const spentMonths=mrows.filter(r=>r.sum>0).length;
  document.getElementById("yearCount").textContent=spentMonths?"متوسط الشهر "+fmt(Math.round(yTotal/spentMonths))+" "+cur().label:"";
  document.getElementById("yearTotal").textContent=fmt(yTotal);
  document.getElementById("yearCur").textContent=cur().label;
  document.getElementById("months").innerHTML=mrows.reverse().map(r=>`<li><button type="button" data-month="${r.k}" class="${r.k===m?"on":""}" ${r.k===m?'aria-current="true"':""}>
    <span class="m-name">${MONTHS[r.i-1]}${r.k===nowKey?" (الشهر الحالي)":""}</span><span class="m-amt num ${r.sum?"":"zero"}">${r.sum?fmt(r.sum)+" "+esc(cur().label):"مفيش مصاريف"}</span>
    <span class="bar" style="grid-column:1 / -1"><i style="width:${yMax?r.sum/yMax*100:0}%"></i></span></button></li>`).join("");

  // log
  const logEl=document.getElementById("log");
  document.getElementById("logCount").textContent = items.length? fmtInt(items.length):"";
  if(!items.length){
    logEl.innerHTML=`<li class="empty"><b>ابدأ من تحت:</b> اكتب اللي اشتريته وسعره ودوس أضف.<span>البرنامج هيحدد الصنف لوحده، ولو مش عارفه هيسألك مرة واحدة ويفتكر إجابتك.</span></li>`;
  } else {
    let html="", lastDay="";
    for(const x of items){
      const dt=dayTitle(x.ts);
      if(dt!==lastDay){ html+=`<li class="day">${esc(dt)}</li>`; lastDay=dt; }
      const c=catById(x.cat)||{name:"؟",color:"#868e96"};
      html+=`<li class="item" data-id="${esc(x.id)}"><button type="button" class="item-name" data-act="report" title="صرفت قد إيه على دي">${esc(x.name)}</button><span class="item-price num">${fmt(x.price)} ${esc(cur().label)}</span>
        <span class="item-tools"><span class="chip"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</span>
        <button class="link" data-act="edit" type="button">عدّل السعر</button>
        <button class="link" data-act="recat" type="button">غيّر الصنف</button>
        <button class="link danger" data-act="del" type="button">امسح</button></span></li>`;
    }
    logEl.innerHTML=html;
  }
}

function pickCategory({title,desc,current,onPick}){
  const cats=allCats().concat([{id:"other",name:"حاجات تانية",color:"#868e96"}]);
  openSheet(`<h3>${esc(title)}</h3>${desc?`<p>${desc}</p>`:""}
    <div class="pick">${cats.map(c=>`<button type="button" data-cat="${c.id}" class="${c.id===current?"on":""}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join("")}</div>
    <div class="newcat"><input id="newCatName" type="text" placeholder="أو اكتب صنف جديد" aria-label="صنف جديد"><button class="secondary" type="button" id="newCatBtn">أضف الصنف</button></div>
    <div class="row"><button class="link" type="button" id="cancelPick">إلغاء</button></div>`, s=>{
    s.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{ closeSheet(); onPick(b.dataset.cat); }));
    const add=()=>{ const v=s.querySelector("#newCatName").value.trim(); if(!v) return;
      const exist=allCats().find(c=>norm(c.name)===norm(v)); if(exist){ closeSheet(); onPick(exist.id); return; }

function parsePrice(s){ const v=parseFloat(toLatinDigits(s).replace(/[^\d.]/g,"")); return isFinite(v)&&v>0?v:null; }
function addExpense(name,price,cat){
  // every purchase is filed under today's date, so it lands in the current month on its own
  const now=new Date(), ts=now.getTime(), m=monthKey(now);
  state.viewMonth=m;
  (state.months[m]=state.months[m]||[]).push({id:"e"+ts.toString(36)+Math.random().toString(36).slice(2,6),name,price,cat,ts,cur:state.settings.currency});
  saveMonth(m); render();
}

/* ---------- Report: one category or one item, month by month ---------- */
function allYears(){
  const now=new Date().getFullYear(); let min=now;
  for(const k of Object.keys(state.months)) if((state.months[k]||[]).length) min=Math.min(min,+k.slice(0,4));
  return {min,max:now};
}
function times(n){ return n===1?"مرة":n===2?"مرتين":fmtInt(n)+(n<=10?" مرات":" مرة"); }
function openReport(rep){
  const active=state.settings.currency, nowKey=monthKey(new Date()), L=esc(cur().label);
  const yr=allYears(); const year=Math.min(yr.max,Math.max(yr.min,rep.year||+state.viewMonth.slice(0,4)));
  const qk=rep.kind==="q"?itemKey(rep.q):"";
  const grp = rep.kind==="grp" ? groups().find(g=>g.id===rep.id) : null;
  if(rep.kind==="grp"&&!grp){ closeSheet(); return; }
  const match = rep.kind==="cat" ? x=>x.cat===rep.id
    : rep.kind==="grp" ? x=>(grp.cats||[]).includes(x.cat)
    : rep.kind==="item" ? x=>itemKey(x.name)===rep.key
    : x=>itemKey(x.name).includes(qk);
  let color="var(--accent)", title;
  if(rep.kind==="cat"){ const c=catById(rep.id)||{name:rep.id,color:"#868e96"}; color=c.color; title=`<span class="dot" style="background:${c.color}"></span>${esc(c.name)}`; }
  else if(rep.kind==="grp"){ color=grp.color; title=`<span class="dot" style="background:${grp.color}"></span>مجموعة ${esc(grp.name)}`; }
  else if(rep.kind==="item") title="«"+esc(rep.name)+"»";
  else title="كل اللي فيه «"+esc(rep.q)+"»";
  const rows=[], picked=[]; let yTotal=0,yMax=0,n=0;
  for(let i=1;i<=12;i++){
    const k=year+"-"+String(i).padStart(2,"0"); if(k>nowKey) break;
    const its=(state.months[k]||[]).filter(x=>itemCur(x)===active&&match(x));
    const sum=its.reduce((a,x)=>a+x.price,0);
    yTotal+=sum; yMax=Math.max(yMax,sum); n+=its.length; picked.push(...its); rows.push({k,i,sum,cnt:its.length});
  }
  const spent=rows.filter(r=>r.sum>0).length;
  const yTxt=state.settings.digits==="en"?String(year):fmtInt(year);

  const repLim = rep.kind==="cat" ? catLimit(rep.id) : rep.kind==="grp" ? grpLimit(grp) : null;
  // what it was spent on (for a category or a search), or purchase details (for one item)
  let detail="";
  if(rep.kind==="grp"){
    const g={}; picked.forEach(x=>{ g[x.cat]=(g[x.cat]||0)+x.price; });
    const list=(grp.cats||[]).map(id=>[id,g[id]||0]).sort((a,b)=>b[1]-a[1]), gmax=list.length&&list[0][1]?list[0][1]:1;

      <span class="m-name"><span class="dot" style="background:${c.color};display:inline-block"></span> ${esc(c.name)}</span><span class="m-amt num ${v?"":"zero"}">${v?fmt(v)+" "+L:"مفيش"}</span>
      <span class="bar" style="grid-column:1 / -1"><i style="width:${v/gmax*100}%;background:${c.color}"></i></span></button></li>`; }).join("")}</ul>`;
  } else if(rep.kind!=="item"){
    const g={}; picked.forEach(x=>{ const key=itemKey(x.name); const e=g[key]||(g[key]={name:x.name,ts:0,sum:0,n:0}); e.sum+=x.price; e.n++; if(x.ts>e.ts){e.ts=x.ts;e.name=x.name;} });
    const list=Object.entries(g).sort((a,b)=>b[1].sum-a[1].sum);
    const gmax=list.length?list[0][1].sum:1;
    if(list.length) detail=`<div class="rep-sec">اتصرفت على إيه في ${yTxt}</div><ul class="months">${list.map(([key,e])=>`<li><button type="button" data-rep-item="${esc(key)}" data-name="${esc(e.name)}">
      <span class="m-name">${esc(e.name)} <span class="cat-go">· ${times(e.n)}</span></span><span class="m-amt num">${fmt(e.sum)} ${L}</span>
      <span class="bar" style="grid-column:1 / -1"><i style="width:${e.sum/gmax*100}%;background:${color}"></i></span></button></li>`).join("")}</ul>`;
  } else if(picked.length){
    const last=picked.reduce((a,x)=>x.ts>a.ts?x:a);
    detail=`<p>آخر مرة: ${esc(dayTitle(last.ts))}${new Date(last.ts).getFullYear()!==new Date().getFullYear()?" "+yTxt:""} بـ ${fmt(last.price)} ${L} · متوسط المرة ${fmt(Math.round(yTotal/n*100)/100)} ${L}</p>`;

    <div class="rep-stats">
      <div><span>إجمالي السنة</span><b class="num">${fmt(yTotal)} <small>${L}</small></b></div>
      <div><span>متوسط الشهر</span><b class="num">${spent?fmt(Math.round(yTotal/spent)):"٠"} <small>${L}</small></b></div>
      ${vm?`<div><span>${MONTHS[vm.i-1]}</span><b class="num">${fmt(vm.sum)} <small>${L}</small></b></div>`:""}
      ${repLim?`<div><span>حد الشهر</span><b class="num">${fmt(repLim)} <small>${L}</small></b></div>`:""}
      <div><span>عدد المرات في السنة</span><b class="num">${fmtInt(n)}</b></div>
    </div>

      <span class="m-name">${MONTHS[r.i-1]}${r.cnt?` <span class="cat-go">· ${times(r.cnt)}</span>`:""}</span><span class="m-amt num ${r.sum?"":"zero"}">${r.sum?fmt(r.sum)+" "+L:"مفيش"}</span>
      <span class="bar" style="grid-column:1 / -1"><i style="width:${repLim?Math.min(100,r.sum/repLim*100):(yMax?r.sum/yMax*100:0)}%;background:${repLim?budColor(budLevel(r.sum,repLim),color):color}"></i></span></button></li>`).join("")}</ul>${detail}`
      :`<p class="empty">مفيش مصاريف ${rep.kind==="q"?"فيها «"+esc(rep.q)+"» ":"على دي "}في سنة ${yTxt} بال${esc(cur().name)}.</p>`}

/* ---------- Search: categories first, then items, filtered live ---------- */
const findEl=document.getElementById("findQ"), findList=document.getElementById("findList");
function searchCats(){ return allCats().concat([{id:"other",name:"حاجات تانية",color:"#868e96"}]); }
function catMatches(q){ const k=itemKey(q); return searchCats().filter(c=>!k||itemKey(c.name).includes(k)||norm(c.name).includes(norm(q))); }
function itemMatches(q){
  const k=itemKey(q); if(!k) return [];
  const map=new Map();
  for(const list of Object.values(state.months)) for(const x of list||[]){
    const key=itemKey(x.name); if(!key.includes(k)) continue;
    const e=map.get(key)||{key,name:x.name,n:0,ts:0,cat:x.cat}; e.n++; if((x.ts||0)>=e.ts){ e.ts=x.ts||0; e.name=x.name; e.cat=x.cat; } map.set(key,e);
  }
  return [...map.values()].sort((a,b)=>(b.key===k)-(a.key===k)||b.n-a.n).slice(0,12);
}
function renderFind(){
  const q=findEl.value.trim(), cats=catMatches(q), items=itemMatches(q);
  let html="";

}

/* ---------- Backup / restore ---------- */
async function makeBackup(){
  const now=new Date(), d=now.toISOString().slice(0,10);
  const data={app:"masarif",version:1,exportedAt:now.toISOString(),settings:state.settings,learned:state.learned,months:state.months};
  const name="masarif-backup-"+d+".txt", text=JSON.stringify(data);
  let done=false;
  try{
    const file=new File([text],name,{type:"text/plain"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"نسخة احتياطية - مصاريفي"}); done=true; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  if(!done){
    try{ const url=URL.createObjectURL(new Blob([text],{type:"text/plain"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); done=true; }catch(e){}
  }
  if(done){ state.settings.lastBackup=now.toISOString(); saveProfile(); toast("النسخة الاحتياطية اتعملت: "+name); }
  else toast("معرفتش أعمل الملف، جرب تاني");
}
function applyBackup(j){
  if(!j||j.app!=="masarif"||typeof j.months!=="object"||!j.months){ toast("الملف ده مش نسخة احتياطية من مصاريفي"); return; }
  let added=0; const touched=[];
  for(const [m,items] of Object.entries(j.months)){
  if(!/^\d{4}-\d{2}$/.test(m)||!Array.isArray(items)) continue;
  const list=state.months[m]=state.months[m]||[], ids=new Set(list.map(i=>i.id));
  let ch=false;
  for(const it of items){ if(!it||!it.id||ids.has(it.id)||typeof it.name!=="string"||!isFinite(+it.price)) continue; list.push(it); ids.add(it.id); added++; ch=true; }
  if(ch){ list.sort((x,y)=>(x.ts||0)-(y.ts||0)); touched.push(m); }
  }
  if(j.learned&&typeof j.learned==="object") state.learned=Object.assign({},state.learned,j.learned);
  const bs=j.settings||{}, mine=state.settings.customCats||[], mineIds=new Set(mine.map(c=>c.id));
  (bs.customCats||[]).forEach(c=>{ if(c&&c.id&&!mineIds.has(c.id)){ mine.push(c); mineIds.add(c.id); } });
  state.settings.customCats=mine;
  if(bs.catNames&&typeof bs.catNames==="object") state.settings.catNames=Object.assign({},bs.catNames,state.settings.catNames||{});
  if(Array.isArray(bs.groups)){ const mineG=groups().slice(), gIds=new Set(mineG.map(g=>g.id)); bs.groups.forEach(g=>{ if(g&&g.id&&g.name&&Array.isArray(g.cats)&&!gIds.has(g.id)){ mineG.push(g); gIds.add(g.id); } }); state.settings.groups=mineG; }
  if(bs.budgets&&typeof bs.budgets==="object"){ const mb=budgets(), ob=bs.budgets, cats=Object.assign({},mb.cats);
    for(const [id,v] of Object.entries(ob.cats||{})) if(v&&typeof v==="object") cats[id]=Object.assign({},v,cats[id]||{});
    state.settings.budgets={total:Object.assign({},ob.total||{},mb.total),cats}; }
  if(Array.isArray(bs.currencies)) state.settings.currencies=[...new Set((state.settings.currencies||[]).concat(bs.currencies))];
  touched.forEach(saveMonth); saveProfile(); render(); closeSheet();
  toast(added?"رجّعت "+fmtInt(added)+" مصروف من النسخة":"كل اللي في النسخة موجود عندك بالفعل");
}
function restoreBackup(file){
  const r=new FileReader();
  r.onload=()=>{ let j; try{ j=JSON.parse(r.result); }catch(e){ j=null; } applyBackup(j); };
  r.onerror=()=>toast("معرفتش أقرا الملف");
  r.readAsText(file);
}

/* ---------- GitHub backup (private repo, token stays on this phone only) ---------- */
const GHK="masarif-gh";
function ghCfg(){ try{ const c=JSON.parse(localStorage.getItem(GHK)||"null"); return c&&c.repo&&c.token?c:null; }catch(e){ return null; } }
function b64(text){ const bytes=new TextEncoder().encode(text); let s=""; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s); }
async function gh(cfg,path,opt={}){
  const r=await fetch("https://api.github.com/repos/"+cfg.repo+path,Object.assign({},opt,{headers:Object.assign({"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.headers||{})}));
  if(!r.ok){ const e=new Error("gh "+r.status); e.status=r.status; throw e; }
  return r;
}
function ghErr(e){
  if(!navigator.onLine) return "مفيش نت، جرب تاني لما تتوصل";
  if(e&&e.status===401) return "الـ token غلط أو انتهى، اعمل واحد جديد من إعدادات GitHub";
  if(e&&(e.status===403||e.status===404)) return "مش قادر أوصل للـ repo، اتأكد من الاسم وإن الـ token ليه صلاحية Contents: Read and write عليه";
  return "حصلت مشكلة في الاتصال بـ GitHub، جرب تاني";
}
function ghSetup(after){
  const c=ghCfg()||{repo:"",token:""};
  openSheet(`<h3>ربط GitHub</h3>
    <p class="note">النسخ هتتحفظ في repo <b>خاص (Private)</b> بتاعك. الـ token بيتحفظ على الموبايل ده بس، ومش بيدخل في ملف النسخة الاحتياطية.</p>
    <label class="fld">اسم الـ repo (صاحبه/اسمه)<input id="ghRepo" type="text" dir="ltr" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="BGamal2023/masarif-data" value="${esc(c.repo)}"></label>
    <label class="fld">الـ token<input id="ghTok" type="password" dir="ltr" autocomplete="off" placeholder="github_pat_..." value="${esc(c.token)}"></label>
    <div class="row"><button class="primary" type="button" id="ghOk" style="padding:10px 18px">جرّب واحفظ</button>${ghCfg()?`<button class="link danger" type="button" id="ghOff">افصل GitHub</button>`:""}<button class="link" type="button" id="ghCancel">إلغاء</button></div>`, s=>{
    s.querySelector("#ghCancel").addEventListener("click",closeSheet);
    const off=s.querySelector("#ghOff"); if(off) off.addEventListener("click",()=>{ try{ localStorage.removeItem(GHK); }catch(e){} closeSheet(); toast("اتفصل GitHub من الموبايل ده"); });
    s.querySelector("#ghOk").addEventListener("click",async ev=>{
      const repo=s.querySelector("#ghRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,""), token=s.querySelector("#ghTok").value.trim();
      if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ toast("اكتب الـ repo بالشكل ده: صاحبه/اسمه"); return; }
      if(!token){ toast("حط الـ token"); return; }
      const btn=ev.currentTarget; btn.disabled=true; btn.textContent="بجرب...";
      try{
        const info=await (await gh({repo,token},"")).json();
        if(!info.private){ toast("الـ repo ده عام، أي حد يقدر يشوف مصاريفك. اعمله Private الأول"); return; }
        if(info.permissions&&info.permissions.push===false){ toast("الـ token ده مش بيقدر يكتب في الـ repo"); return; }
        try{ localStorage.setItem(GHK,JSON.stringify({repo,token})); }catch(e){ toast("معرفتش أحفظ الإعداد على الموبايل"); return; }
        closeSheet(); toast("تمام، اتربط GitHub"); if(after) after();
      }catch(e){ toast(ghErr(e)); }
      finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent="جرّب واحفظ"; } }
    });
  });
}
async function ghSave(ev){
  const cfg=ghCfg(); if(!cfg){ ghSetup(ghSave); return; }
  const btn=ev&&ev.currentTarget; if(btn){ btn.disabled=true; btn.textContent="بحفظ..."; }
  const now=new Date(), p2=n=>String(n).padStart(2,"0");
  const stamp=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate())+"_"+p2(now.getHours())+"-"+p2(now.getMinutes())+"-"+p2(now.getSeconds());
  const data={app:"masarif",version:1,exportedAt:now.toISOString(),settings:state.settings,learned:state.learned,months:state.months};
  try{
    await gh(cfg,"/contents/backups/masarif-"+stamp+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Backup "+stamp,content:b64(JSON.stringify(data))})});
    state.settings.lastBackup=now.toISOString(); saveProfile(); toast("اتحفظت على GitHub ✓");
  }catch(e){ toast(ghErr(e)); }
  finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent="احفظ على GitHub"; } }
}
function backupLabel(name){
  const m=name.match(/(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})/); if(!m) return name;
  const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);
  return d.toLocaleString(state.settings.digits==="en"?"en-GB":"ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit"});
}
async function ghList(ev){
  const cfg=ghCfg(); if(!cfg){ ghSetup(ghList); return; }
  const btn=ev&&ev.currentTarget; if(btn){ btn.disabled=true; btn.textContent="بجيب النسخ..."; }
  let files=[];
  try{ files=await (await gh(cfg,"/contents/backups")).json(); }
  catch(e){ if(e&&e.status===404) files=[]; else { toast(ghErr(e)); if(btn&&btn.isConnected){ btn.disabled=false; btn.textContent="استرجع من GitHub"; } return; } }
  files=(Array.isArray(files)?files:[]).filter(f=>f.type==="file"&&/^masarif-.*\.json$/.test(f.name)).sort((a,b)=>b.name.localeCompare(a.name));
  openSheet(`<h3>استرجع من GitHub</h3>
    ${files.length?`<p class="note">اختار النسخة. الاسترجاع بيضيف اللي مش عندك بس، ومش بيمسح حاجة.</p><div class="pick" style="grid-template-columns:1fr">${files.slice(0,30).map((f,i)=>`<button type="button" data-ghf="${esc(f.path)}">${i===0?"<b>الأحدث:</b> ":""}${esc(backupLabel(f.name))}</button>`).join("")}</div>`:`<p>لسه مفيش نسخ محفوظة على GitHub. دوس "احفظ على GitHub" الأول.</p>`}
    <div class="row"><button class="link" type="button" id="ghBack">رجوع</button></div>`, s=>{
    s.querySelector("#ghBack").addEventListener("click",closeSheet);
    s.querySelectorAll("[data-ghf]").forEach(b=>b.addEventListener("click",async()=>{
      b.disabled=true; b.textContent="بسترجع...";
      try{ const r=await gh(cfg,"/contents/"+b.dataset.ghf.split("/").map(encodeURIComponent).join("/"),{headers:{"Accept":"application/vnd.github.raw+json"}}); let j=null; try{ j=JSON.parse(await r.text()); }catch(e){} applyBackup(j); }
      catch(e){ toast(ghErr(e)); if(b.isConnected){ b.disabled=false; b.textContent=backupLabel(b.dataset.ghf.split("/").pop()); } }
    }));
  });
}
